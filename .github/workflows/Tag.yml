name: Hello World
on: 
  pull_request:
    types: [closed]

jobs:
  create-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: push tag
        run: |
            TAG_VERSION="P1.0.${{ github.event.pull_request.title }}"
            git tag $TAG_VERSION
            git push origin $TAG_VERSION
