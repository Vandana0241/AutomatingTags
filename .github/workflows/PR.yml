name: Tag from PR
on: 
  pull_request:
    types: [closed]

jobs:
  tag_pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Print Pull Request Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DATE: ${{ github.event.pull_request.created_at }}
          
        run: |
          ONLY_NUMBERS=$(echo "$PR_TITLE" | tr -cd '0-9')
          echo "R$ONLY_NUMBERS.0 $PR_DATE PROD Release"
